<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emma Saga 💖</title><style>body{margin:0;text-align:center;font-family:sans-serif;background:linear-gradient(#ff9ecf,#a78bfa);color:#fff}h1{margin:8px}#board{width:336px;max-width:94vw;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:#fff3;padding:8px;border-radius:20px}.c{aspect-ratio:1;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}.sel{outline:3px solid #db2777;transform:scale(1.1)}button{background:#fff;color:#db2777;border:0;padding:12px 22px;border-radius:99px;font-weight:900;margin-top:10px}</style></head><body>
<h1>💖 Emma Saga 🍬</h1><p>⭐ <span id="sc">0</span> | 🎯 الهدف: 500 | 🔄 <span id="mv">20</span> حركات</p><div id="board"></div><button onclick="location.reload()">🔄 العبي من جديد</button><p id="msg">وركي على حلوة، و من بعد وركي على اللي حداها باش تبدليهم!</p>
<script>
let E=['💖','🍬','🍭','⭐','💜','🍓','💙','🍩'],board=[],sel=null,sc=0,mv=20,b=document.getElementById('board');
function rnd(){return Math.floor(Math.random()*6)}
for(let i=0;i<64;i++)board.push(rnd());
function draw(){b.innerHTML='';board.forEach((v,i)=>{let d=document.createElement('div');d.className='c'+(sel===i?' sel':'');d.innerText=E[v];d.onclick=()=>click(i);b.appendChild(d)})}
function click(i){if(sel===null){sel=i;draw();return}let a=sel;sel=null;if(Math.abs(a-i)!==1&&Math.abs(a-i)!==8){draw();return}let t=board[a];board[a]=board[i];board[i]=t;let m=find();if(m.length===0){let t2=board[a];board[a]=board[i];board[i]=t2;draw();return}mv--;document.getElementById('mv').innerText=mv;clear(m);draw();if(mv<=0)setTimeout(()=>alert(sc>=500?'🎉 ربحتي يا Emma! Score: '+sc:'Game Over! Score: '+sc),300)}
function find(){let s=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++){let i=r*8+c;if(board[i]===board[i+1]&&board[i]===board[i+2]){s.add(i);s.add(i+1);s.add(i+2)}}for(let c=0;c<8;c++)for(let r=0;r<6;r++){let i=r*8+c;if(board[i]===board[i+8]&&board[i]===board[i+16]){s.add(i);s.add(i+8);s.add(i+16)}}return [...s]}
function clear(m){sc+=m.length*10;document.getElementById('sc').innerText=sc;if(sc>=500)document.getElementById('msg').innerText='🎉 ربحتيييي! برافو Emma!';m.forEach(i=>board[i]=-1);for(let c=0;c<8;c++){let col=[];for(let r=7;r>=0;r--){let i=r*8+c;if(board[i]!==-1)col.push(board[i])}while(col.length<8)col.push(rnd());for(let r=7;r>=0;r--)board[r*8+c]=col[7-r]}let nm=find();if(nm.length>0)setTimeout(()=>{clear(nm);draw()},300)}
draw();
</script></body></html>
