<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emma Saga 💖</title><style>body{margin:0;text-align:center;font-family:sans-serif;background:linear-gradient(#ff9ecf,#a78bfa);color:#fff}h1{margin:10px}#g{width:340px;max-width:94vw;height:460px;background:#fff;border-radius:20px;margin:auto;position:relative;overflow:hidden}.b{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;cursor:pointer}button{background:#fff;color:#db2777;border:0;padding:12px 20px;border-radius:99px;font-weight:900}</style></head><body>
<h1>💖 Emma Saga 👑</h1><p>⭐ <span id="s">0</span> | 🏆 Niv <span id="l">1</span> | ❤️ <span id="v">3</span></p><div id="g"></div><br><button onclick="go()">▶ JOUER</button>
<script>
let sc=0,lv=1,vi=3,E=['💖','⭐','💜','💙','💛','🌸'],g=document.getElementById('g');
function go(){g.innerHTML='';sc=0;lv=1;vi=3;upd();setInterval(add,900)}
function upd(){document.getElementById('s').innerText=sc;document.getElementById('l').innerText=lv;document.getElementById('v').innerText=vi}
function add(){if(vi<=0)return;let d=document.createElement('div');d.className='b';d.innerText=E[Math.floor(Math.random()*E.length)];d.style.left=Math.random()*280+'px';d.style.top='0px';d.style.background='#'+Math.floor(Math.random()*16777215).toString(16);g.appendChild(d);let t=setInterval(()=>{let y=parseInt(d.style.top)+3;d.style.top=y+'px';if(y>420){clearInterval(t);d.remove();vi--;upd();if(vi<=0)alert('Game Over Emma! Score: '+sc)}},30);d.onclick=()=>{clearInterval(t);d.remove();sc+=10;if(sc%50==0)lv++;upd()}}
</script></body></html>
